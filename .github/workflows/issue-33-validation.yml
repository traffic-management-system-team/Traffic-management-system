name: Issue 33 validation

on:
  pull_request:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "include/**"
      - "src/**"
      - "tests/**"
      - "frontend/**"
      - ".github/workflows/issue-33-validation.yml"
  push:
    branches: ["dinesh/issue-33-api-contract-tests"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend ${{ matrix.os }} / ${{ matrix.configuration }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        configuration: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Disable automatic CRLF conversion before checkout
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DBUILD_API_SERVER=ON -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.configuration }} --parallel 2

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.configuration }} --output-on-failure

  frontend:
    name: Frontend typecheck, unit and component tests, production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.17"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run type-check
      - run: npm test
      - run: npm run build

  static-analysis:
    name: Clang Static Analyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy

      - name: Configure with clang-tidy
        run: >-
          cmake -S . -B build-analysis
          -DBUILD_API_SERVER=OFF
          -DBUILD_TESTING=ON
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_CXX_CLANG_TIDY=clang-tidy

      - name: Run static analysis while building core and tests
        run: cmake --build build-analysis --parallel 2

  sanitizers:
    name: Core AddressSanitizer and UndefinedBehaviorSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Clang sanitizer build
        run: >-
          cmake -S . -B build-sanitizers
          -DBUILD_API_SERVER=OFF
          -DBUILD_TESTING=ON
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-sanitizers --parallel 2

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-sanitizers --output-on-failure
